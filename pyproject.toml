[project]
name = "mobilerun"
version = "0.7.4"
description = "A framework for controlling mobile devices through LLM agents"
authors = [{ name = "Niels Schmidt", email = "niels@droidrun.ai" }]
dependencies = [
    "async_adbutils",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.16.0,<3",
    "platformdirs>=4",
    "Jinja2>=3.1.6",
    "prompt-toolkit>=3",
    "typing-extensions>=4",
    "rich>=14.1.0",
    "InquirerPy>=0.3.4",
    "httpx>=0.27.0",
    "click>=8.1",
    "PyYAML>=6.0",
    "tomlkit>=0.13,<1",
    "requests>=2.0",
    "aiofiles>=25.1.0",
    "mobilerun-sdk>=6.3.1,<7",
    "mobilerun-core-local[cloud]>=0.6.3",
    # Security floors also protect installations from the published wheel.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "Pillow>=13.0.0",
    "urllib3>=2.8.0",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Emulators",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/droidrun/mobilerun"
"Bug Tracker" = "https://github.com/droidrun/mobilerun/issues"
Documentation = "https://docs.mobilerun.ai/"

[project.optional-dependencies]
sandbox = [
    "mobilerun-functions[device]==0.1.0",
    "jsonschema>=4,<5",
]
dev = [
    "black==26.10.1",
    "hatchling>=1.27",
    "ruff>=0.13.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "bandit>=1.8.6",
    "safety>=3.2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["mobilerun"]

[tool.hatch.build.targets.sdist]
exclude = ["/cloud-screenshot.png", "/local-screenshot.png", "/skills/**"]

[tool.hatch.build.targets.sdist.force-include]
"hatch_build.py" = "hatch_build.py"
[project.entry-points."mobilerun.cli"]
macro = "mobilerun.macro.cli.group:macro"
mcp = "mobilerun.mcp.cli.group:mcp"
sandbox = "mobilerun.sandbox.cli.group:sandbox"
skills = "mobilerun.skills.cli.group:skills"

[project.scripts]
mobilerun = "mobilerun.cli.app:cli"

[tool.uv]
override-dependencies = ["filelock>=4.2.1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

# Modules with type errors that predate the mypy CI gate. Fix a module, then
# delete its line: this list only shrinks. New modules must pass.
[[tool.mypy.overrides]]
module = [
    "mobilerun.cli.base.menu",
    "mobilerun.cli.base.prompts",
    "mobilerun.cli.base.render",
    "mobilerun.cli.credentials.group",
    "mobilerun.cli.devices.action",
    "mobilerun.cli.devices.action.extensions",
    "mobilerun.cli.devices.action.list",
    "mobilerun.cli.devices.app",
    "mobilerun.cli.devices.app.install",
    "mobilerun.cli.devices.app.list",
    "mobilerun.cli.devices.app.open",
    "mobilerun.cli.devices.app.start",
    "mobilerun.cli.devices.app.stop",
    "mobilerun.cli.devices.app.uninstall",
    "mobilerun.cli.devices.base.default",
    "mobilerun.cli.devices.base.pickers",
    "mobilerun.cli.devices.cloud",
    "mobilerun.cli.devices.cloud.reboot",
    "mobilerun.cli.devices.cloud.rename",
    "mobilerun.cli.devices.cloud.status",
    "mobilerun.cli.devices.cloud.stop",
    "mobilerun.cli.devices.cloud.terminate",
    "mobilerun.cli.devices.file",
    "mobilerun.cli.devices.file.list",
    "mobilerun.cli.devices.file.pull",
    "mobilerun.cli.devices.file.push",
    "mobilerun.cli.devices.file.rm",
    "mobilerun.cli.devices.input",
    "mobilerun.cli.devices.input.long_press",
    "mobilerun.cli.devices.input.press",
    "mobilerun.cli.devices.input.swipe",
    "mobilerun.cli.devices.input.tap",
    "mobilerun.cli.devices.input.type",
    "mobilerun.cli.devices.ping",
    "mobilerun.cli.devices.screen",
    "mobilerun.cli.devices.screen.screenshot",
    "mobilerun.cli.devices.screen.ui",
    "mobilerun.cli.devices.settings",
    "mobilerun.cli.devices.settings.language.get",
    "mobilerun.cli.devices.settings.language.set",
    "mobilerun.cli.devices.settings.location.get",
    "mobilerun.cli.devices.settings.location.reset",
    "mobilerun.cli.devices.settings.location.set",
    "mobilerun.cli.devices.settings.timezone.get",
    "mobilerun.cli.devices.settings.timezone.set",
    "mobilerun.cli.doctor",
    "mobilerun.cli.proxy.group",
    "mobilerun.clients.cloud.apps",
    "mobilerun.clients.cloud.devices",
    "mobilerun.clients.cloud.errors",
    "mobilerun.clients.cloud.mailboxes",
    "mobilerun.clients.cloud.numbers",
    "mobilerun.clients.cloud.payments",
    "mobilerun.clients.cloud.proxies",
    "mobilerun.clients.cloud.tasks",
    "mobilerun.clients.portal.http",
    "mobilerun.clients.portal.releases",
    "mobilerun.config.loader",
    "mobilerun.config.settings",
    "mobilerun.config.user_config",
    "mobilerun.core.credentials.cloud",
    "mobilerun.core.credentials.file",
    "mobilerun.core.devices.android",
    "mobilerun.core.devices.base",
    "mobilerun.core.devices.cloud",
    "mobilerun.core.devices.components.cloud_lifecycle",
    "mobilerun.core.devices.components.raw",
    "mobilerun.core.devices.ios",
    "mobilerun.core.devices.pool",
    "mobilerun.core.devices.remote",
    "mobilerun.core.extensions.actions",
    "mobilerun.core.extensions.base",
    "mobilerun.core.mailbox.cloud",
    "mobilerun.core.phone_number.cloud",
    "mobilerun.core.state.filters.detailed_filter",
    "mobilerun.diagnostics.versions",
    "mobilerun.errors.base",
    "mobilerun.macro.cli.replay",
    "mobilerun.mcp.settings",
    "mobilerun.mcp.utils",
    "mobilerun.sandbox._runtime",
    "mobilerun.sandbox.app",
    "mobilerun.sandbox.cleanup",
    "mobilerun.sandbox.deployment",
    "mobilerun.sandbox.execution",
    "mobilerun.sandbox.flows",
    "mobilerun.sandbox.packaging",
    "mobilerun.sandbox.receipts",
    "mobilerun.skills.bundle",
    "mobilerun.skills.cli.common",
    "mobilerun.skills.cli.install",
    "mobilerun.skills.cli.list",
    "mobilerun.skills.utils",
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
markers = [
    "smoke: opt-in real-world smoke tests",
    "smoke_device: local emulator, no service cost",
    "smoke_cloud: cloud device and potentially cloud credits",
    "smoke_llm: local agent using LLM tokens",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
]
ignore = ["E501"]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "safety>=3.2.11",
]
