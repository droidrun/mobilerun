# Example values only. Never commit a file containing real secrets.
# Attach FileCredentials("credentials.yaml") to a device, or enable the
# credentials file in CLI configuration. All providers use the same format.

# Flat secrets automatically become unbound credentials with a password field.
gmail_password: "example-only"

# Full form: package → name → fields, matching the Cloud vault.
com.google.android.gm:
  work:
    email: "example@example.com"
    password: "example-only"

# Agent tool: {"action": "type_secret", "package": "com.google.android.gm",
#              "name": "work", "field": "password", "index": 5}
# Direct API: await device.type_credential(None, name="gmail_password")
