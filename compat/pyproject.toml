[project]
name = "droidrun"
version = "0.8.0"
description = "Compatibility shim — droidrun has been renamed to mobilerun"
requires-python = ">=3.11,<3.14"
dependencies = ["mobilerun==0.8.0"]

[project.optional-dependencies]
anthropic = ["mobilerun[anthropic]==0.8.0"]
deepseek = ["mobilerun[deepseek]==0.8.0"]
langfuse = ["mobilerun[langfuse]==0.8.0"]
typesafe = ["mobilerun[typesafe]==0.8.0"]
dev = ["mobilerun[dev]==0.8.0"]

[project.scripts]
droidrun = "droidrun.cli_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["droidrun"]
