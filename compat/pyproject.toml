[project]
name = "droidrun"
version = "0.7.4"
description = "Compatibility shim — droidrun has been renamed to mobilerun"
requires-python = ">=3.11,<3.14"
dependencies = ["mobilerun==0.7.4", "mobilerun-agents==0.1.0"]

[project.optional-dependencies]
anthropic = ["mobilerun-agents[anthropic]==0.1.0"]
deepseek = ["mobilerun-agents[deepseek]==0.1.0"]
langfuse = ["mobilerun-agents[langfuse]==0.1.0"]
dev = ["mobilerun[dev]==0.7.4"]

[project.scripts]
droidrun = "droidrun.cli_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["droidrun"]
