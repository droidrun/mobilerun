name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - uses: psf/black@stable
        with:
          options: "--check --diff --verbose"
          src: "."
          version: "26.10.1"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The oldest supported interpreter has to be able to parse the package.
      - run: python -m compileall -q mobilerun
